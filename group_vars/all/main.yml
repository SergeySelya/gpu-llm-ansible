---
# Основные параметры. Полный список с дефолтами - roles/*/defaults/main.yml.

nvidia_driver_branch: "580"

llm_model: "Qwen/Qwen2.5-1.5B-Instruct"
llm_served_model_name: "qwen2.5-1.5b"
llm_max_model_len: 8192
llm_gpu_memory_utilization: 0.90

llm_api_key: "{{ vault_llm_api_key | default('') }}"
llm_hf_token: "{{ vault_hf_token | default('') }}"

# Кто может ходить в API и в /metrics (nginx allow/deny)
llm_allowed_cidrs:
  - 10.0.0.0/8
  - 192.168.0.0/16
llm_metrics_allowed_cidrs:
  - 10.0.0.0/8
